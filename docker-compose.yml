version: '3.8'

services:
  api:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    # environment:
    #   - DATABASE_URL=mysql+mysqlconnector://user:password@db:3306/fastapi_db
    #   - REDIS_URL=redis://redis:6379/0
    #   - JWT_SECRET_KEY=${JWT_SECRET_KEY:-PBvTQN9ii-ruhD-BGTDQEpPwLXU8WcijsaPunRpTr4I}
    #   - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
    #   - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-43200}
    depends_on:
      - redis
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # db:
  #   image: mysql:8.0
  #   container_name: fastapi_db
  #   restart: always
  #   environment:
  #     MYSQL_DATABASE: fastapi_db
  #     MYSQL_USER: user
  #     MYSQL_PASSWORD: password
  #     MYSQL_ROOT_PASSWORD: rootpassword
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: fastapi_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:
