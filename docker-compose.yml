version: "3.8"

services:
  api:
    build: .
    container_name: fastapi_app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  redis:
    image: redis:alpine
    container_name: fastapi_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:
